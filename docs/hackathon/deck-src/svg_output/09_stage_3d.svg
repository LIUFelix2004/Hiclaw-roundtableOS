    <text x="968" y="276" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#F1F5F9">增速口径与基数效应混淆了，建议按新增<tspan x="968" dy="18.0">装机重新界定。</tspan></text>
  </g>

  <g id="viz-features" data-pptx-bounds="72.0 232.0 523.2 376.0">
    <rect x="72" y="232" width="470" height="376" rx="16" ry="16" fill="url(#glassSoft)" stroke="#1E2C4A" stroke-width="1" />
    <text x="104" y="274" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#F1F5F9" font-weight="900">为什么值得做成 3D</text>
    <text x="104" y="306" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">多智能体最难被感知的是「同时性」—— 谁在等、谁在想、谁在反对。<tspan x="104" dy="22.1">平铺的聊天流表达不了这件事，一张桌子可以。</tspan></text>
    <circle cx="110" cy="375" r="4" fill="#22D3EE" />
    <text x="128" y="380" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700">Three.js + CSS2D</text>
    <text x="128" y="402" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">七个席位环绕圆桌，可自由旋转与缩放视角</text>
    <circle cx="110" cy="431.0" r="4" fill="#22D3EE" />
    <text x="128" y="436.0" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700">思考态动画</text>
    <text x="128" y="458.0" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">头部摆动与光环脉冲，实时反映谁正在推理</text>
    <circle cx="110" cy="487.0" r="4" fill="#22D3EE" />
    <text x="128" y="492.0" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700">持久发言气泡</text>
    <text x="128" y="514.0" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">每位智能体的观点摘要停留在座位上方</text>
    <circle cx="110" cy="543.0" r="4" fill="#22D3EE" />
    <text x="128" y="548.0" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700">结论定格</text>
    <text x="128" y="570.0" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">共识达成后场景统一切换为最终方案展示</text>
  </g>

