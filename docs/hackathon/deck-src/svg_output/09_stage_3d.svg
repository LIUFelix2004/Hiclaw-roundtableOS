  <g id="speech-bubble" data-pptx-bounds="948.0 228.0 293.5 76.0">
    <rect x="948" y="228" width="252" height="76" rx="12" ry="12" fill="#6366F1" fill-opacity="0.14" stroke="#6366F1" stroke-opacity="0.55" stroke-width="1" />
