    <text x="98.0" y="404" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#6366F1" letter-spacing="1.8">ACCURACY</text>
    <text x="98.0" y="442" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="25" fill="#F1F5F9" font-weight="900">准确性</text>
    <line x1="98.0" y1="462" x2="132.0" y2="462" stroke="#6366F1" stroke-width="2" />
    <text x="98.0" y="490" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">事实与数据是否站得住</text>
    <rect x="362.0" y="372" width="266.0" height="150" rx="14" ry="14" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <text x="388.0" y="404" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#22D3EE" letter-spacing="1.8">COMPLETENESS</text>
    <text x="388.0" y="442" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="25" fill="#F1F5F9" font-weight="900">完整性</text>
    <line x1="388.0" y1="462" x2="422.0" y2="462" stroke="#22D3EE" stroke-width="2" />
    <text x="388.0" y="490" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">议题要求是否全部覆盖</text>
    <rect x="652.0" y="372" width="266.0" height="150" rx="14" ry="14" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <text x="678.0" y="404" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#EF4444" letter-spacing="1.8">SAFETY</text>
    <text x="678.0" y="442" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="25" fill="#F1F5F9" font-weight="900">安全性</text>
    <line x1="678.0" y1="462" x2="712.0" y2="462" stroke="#EF4444" stroke-width="2" />
    <text x="678.0" y="490" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">是否越界或含有害内容</text>
    <rect x="942.0" y="372" width="266.0" height="150" rx="14" ry="14" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <text x="968.0" y="404" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#10B981" letter-spacing="1.8">FORMAT</text>
    <text x="968.0" y="442" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="25" fill="#F1F5F9" font-weight="900">格式</text>
    <line x1="968.0" y1="462" x2="1002.0" y2="462" stroke="#10B981" stroke-width="2" />
    <text x="968.0" y="490" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">是否符合下游可消费的结构</text>
  </g>

  <g id="loop-note" data-pptx-bounds="72.0 553.1 642.0 42.8">
    <text x="72" y="566" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#9FB0CC">拦截不是终点：每次不通过都会触发一轮恢复，最多五轮仍不过才升级为人工工单。</text>
    <text x="72" y="592" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#5E7093">这条闸门同样作用于每一个 Agent 的中间产出，圆桌只是它守住的最后一道。</text>
  </g>

