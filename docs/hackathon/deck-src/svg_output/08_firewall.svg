    <text x="700" y="259" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#10B981">pass  →  共识发布，执行任务进入流水线</text>
    <rect x="676" y="290" width="532" height="42" rx="21" ry="21" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-opacity="0.6" stroke-width="1" />
