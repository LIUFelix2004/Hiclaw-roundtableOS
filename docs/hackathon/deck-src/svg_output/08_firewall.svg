  <g id="header" data-pptx-bounds="72.0 67.0 566.3 99.0">
    <text x="72" y="78" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#10B981" font-weight="700" letter-spacing="3">圆桌 05 / FIREWALL</text>
    <text x="72" y="130" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="38" fill="#F1F5F9" font-weight="900">共识也要过闸：出口防火墙</text>
    <text x="72" y="162" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#5E7093">圆桌讨论出的最终方案没有豁免权 —— 不过质检，就不允许发布</text>
  </g>

  <g id="firewall-flow" data-pptx-bounds="72.0 232.0 1136.0 100.0">
