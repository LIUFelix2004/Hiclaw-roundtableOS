    <text x="462" y="292" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC" text-anchor="middle">四维评分 · 一票否决</text>
    <text x="462" y="314" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#22D3EE" text-anchor="middle" letter-spacing="2">OUTPUT  FIREWALL</text>
    <line x1="604" y1="281" x2="634" y2="281" stroke="#1E2C4A" stroke-width="1.2" />
    <line x1="634" y1="252" x2="634" y2="310" stroke="#1E2C4A" stroke-width="1.2" />
    <line x1="634" y1="252" x2="666" y2="252" stroke="#10B981" stroke-width="1.4" marker-end="url(#arrowGreen)" />
    <line x1="634" y1="310" x2="666" y2="310" stroke="#EF4444" stroke-width="1.4" marker-end="url(#arrowRed)" />
