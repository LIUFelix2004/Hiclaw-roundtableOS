    <text x="118.0" y="423" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">梳理政策与供需变化，指出三条主线的驱动差异</text>
    <circle cx="105.0" cy="452" r="3.5" fill="#F59E0B" />
    <text x="118.0" y="456" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#F59E0B" font-weight="700">分析师</text>
    <text x="118.0" y="476" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">基于数据提出优先级判断与分阶段建议</text>
    <circle cx="105.0" cy="505" r="3.5" fill="#10B981" />
    <text x="118.0" y="509" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#10B981" font-weight="700">撰稿员</text>
    <text x="118.0" y="529" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">将初步结论组织为可读的方案骨架</text>
