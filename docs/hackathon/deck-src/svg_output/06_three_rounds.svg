    <text x="877.3333333333334" y="266" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#22D3EE" font-weight="700" letter-spacing="2.4">ROUND 3</text>
    <text x="877.3333333333334" y="302" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#F1F5F9" font-weight="900">收束补强</text>
    <rect x="1076.0" y="278" width="104" height="26" rx="13.0" ry="13.0" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1" />
    <text x="1128.0" y="294.96" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="10.5" fill="#22D3EE" text-anchor="middle">supplement</text>
    <line x1="877.3333333333334" y1="322" x2="1180.0" y2="322" stroke="#1E2C4A" stroke-width="1" />
    <circle cx="882.3333333333334" cy="346" r="3.5" fill="#5E7093" />
    <text x="895.3333333333334" y="350" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#5E7093" font-weight="700">全体</text>
    <text x="895.3333333333334" y="370" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">围绕存活下来的方案补齐执行细节</text>
    <circle cx="882.3333333333334" cy="399" r="3.5" fill="#F59E0B" />
    <text x="895.3333333333334" y="403" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#F59E0B" font-weight="700">分析师</text>
    <text x="895.3333333333334" y="423" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">把判断转成可执行的阶段划分与观察指标</text>
    <circle cx="882.3333333333334" cy="452" r="3.5" fill="#3B82F6" />
    <text x="895.3333333333334" y="456" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#3B82F6" font-weight="700">数据员</text>
    <text x="895.3333333333334" y="476" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">确认每条结论都有据可查、来源可标注</text>
    <circle cx="882.3333333333334" cy="505" r="3.5" fill="#8B5CF6" />
    <text x="895.3333333333334" y="509" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#8B5CF6" font-weight="700">主持人</text>
    <text x="895.3333333333334" y="529" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">宣布进入合成阶段，停止新增议题</text>
