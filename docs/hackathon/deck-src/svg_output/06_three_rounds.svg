    <circle cx="105.0" cy="346" r="3.5" fill="#3B82F6" />
    <text x="118.0" y="350" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#3B82F6" font-weight="700">数据员</text>
    <text x="118.0" y="370" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">给出装机、渗透率与价格口径，标注每项置信度</text>
    <circle cx="105.0" cy="399" r="3.5" fill="#6366F1" />
