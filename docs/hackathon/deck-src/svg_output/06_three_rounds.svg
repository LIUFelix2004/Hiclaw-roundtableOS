    <circle cx="493.6666666666667" cy="346" r="3.5" fill="#EF4444" />
    <text x="506.6666666666667" y="350" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#EF4444" font-weight="700">质疑方</text>
    <text x="506.6666666666667" y="370" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">指出增速口径与基数效应混淆，要求重新界定</text>
    <circle cx="493.6666666666667" cy="399" r="3.5" fill="#22D3EE" />
    <text x="506.6666666666667" y="403" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#22D3EE" font-weight="700">补充方</text>
    <text x="506.6666666666667" y="423" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">补上政策退坡的时间窗，修正节奏判断</text>
    <circle cx="493.6666666666667" cy="452" r="3.5" fill="#EF4444" />
    <text x="506.6666666666667" y="456" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#EF4444" font-weight="700">质疑方</text>
    <text x="506.6666666666667" y="476" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">挑战「优先储能」的前提，要求给出反例条件</text>
    <circle cx="493.6666666666667" cy="505" r="3.5" fill="#22D3EE" />
    <text x="506.6666666666667" y="509" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#22D3EE" font-weight="700">补充方</text>
    <text x="506.6666666666667" y="529" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">追加风险项与触发式调整条件</text>
