    <rect x="298.6666666666667" y="278" width="104" height="26" rx="13.0" ry="13.0" fill="#6366F1" fill-opacity="0.10" stroke="#6366F1" stroke-opacity="0.55" stroke-width="1" />
    <text x="350.6666666666667" y="294.96" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="10.5" fill="#6366F1" text-anchor="middle">propose</text>
