    <text x="152" y="264" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700">快照回滚</text>
    <text x="152" y="284" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#5E7093" letter-spacing="0.8">snapshot_restore</text>
    <line x1="304" y1="248" x2="304" y2="282" stroke="#1E2C4A" stroke-width="1" />
    <text x="328" y="273" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">复用最近一次通过校验的输出，瞬时恢复，零 Token 成本</text>
    <line x1="115" y1="298" x2="115" y2="310" stroke="#1E2C4A" stroke-width="1" />
    <rect x="72" y="310" width="700" height="66" rx="12" ry="12" fill="url(#glassSoft)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="94" y="328" width="42" height="30" rx="7" ry="7" fill="#4C6FFF" fill-opacity="0.14" stroke="#4C6FFF" stroke-opacity="0.55" stroke-width="1" />
    <text x="115" y="348" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#4C6FFF" font-weight="700" text-anchor="middle">L2</text>
    <text x="152" y="342" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700">模型切换</text>
    <text x="152" y="362" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#5E7093" letter-spacing="0.8">model_switch</text>
    <line x1="304" y1="326" x2="304" y2="360" stroke="#1E2C4A" stroke-width="1" />
    <text x="328" y="351" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">按经验记忆的历史成功率排序，依次更换模型重跑</text>
    <line x1="115" y1="376" x2="115" y2="388" stroke="#1E2C4A" stroke-width="1" />
    <rect x="72" y="388" width="700" height="66" rx="12" ry="12" fill="url(#glassSoft)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="94" y="406" width="42" height="30" rx="7" ry="7" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="1" />
    <text x="115" y="426" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#F59E0B" font-weight="700" text-anchor="middle">L3</text>
    <text x="152" y="420" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700">原模型重跑</text>
    <text x="152" y="440" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#5E7093" letter-spacing="0.8">rerun</text>
    <line x1="304" y1="404" x2="304" y2="438" stroke="#1E2C4A" stroke-width="1" />
    <text x="328" y="429" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">无可用备选时以原模型重试，覆盖瞬时抖动类故障</text>
    <line x1="115" y1="454" x2="115" y2="466" stroke="#1E2C4A" stroke-width="1" />
    <rect x="72" y="466" width="700" height="66" rx="12" ry="12" fill="url(#glassSoft)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="94" y="484" width="42" height="30" rx="7" ry="7" fill="#EF4444" fill-opacity="0.14" stroke="#EF4444" stroke-opacity="0.55" stroke-width="1" />
    <text x="115" y="504" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#EF4444" font-weight="700" text-anchor="middle">L4</text>
    <text x="152" y="498" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700">人工升级</text>
    <text x="152" y="518" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#5E7093" letter-spacing="0.8">human_escalation</text>
    <line x1="304" y1="482" x2="304" y2="516" stroke="#1E2C4A" stroke-width="1" />
    <text x="328" y="507" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">生成含失败原因与操作建议的工单，推送到前端等待介入</text>
  </g>

