    <path d="M922 506 L954 506 L954 418 L922 418" fill="none" stroke="#33507F" stroke-width="1.2" stroke-opacity="0.7" marker-end="url(#arrowHi)" />
    <text x="962" y="465.0" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#5E7093" letter-spacing="1">闭环</text>
  </g>

  <g id="err-note" data-pptx-bounds="72.0 566.0 596.7 15.6">
