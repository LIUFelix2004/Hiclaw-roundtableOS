    <text x="832" y="266" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#22D3EE" font-weight="700" letter-spacing="2.2">EXPERIENCE  MEMORY</text>
    <text x="832" y="306" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="25" fill="#F1F5F9" font-weight="900">越跑越准</text>
    <text x="832" y="336" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">每次执行都按角色 × 模型 × 任务类型记录成败并落盘，反过<tspan x="832" dy="21.4">来决定下次选哪个模型、回滚时先试哪个。</tspan></text>
