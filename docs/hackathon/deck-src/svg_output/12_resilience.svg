  <g id="header" data-pptx-bounds="72.0 67.0 709.6 99.0">
    <text x="72" y="78" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#10B981" font-weight="700" letter-spacing="3">底座 02 / RESILIENCE</text>
    <text x="72" y="130" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="38" fill="#F1F5F9" font-weight="900">失败怎么救：四级自愈 + 经验记忆</text>
    <text x="72" y="162" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#5E7093">失败不是终点，而是恢复流程的入口；每一次成败都会改变下一次的选择</text>
  </g>

  <g id="ladder" data-pptx-bounds="72.0 232.0 700.0 300.0">
    <rect x="72" y="232" width="700" height="66" rx="12" ry="12" fill="url(#glassSoft)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="94" y="250" width="42" height="30" rx="7" ry="7" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.55" stroke-width="1" />
