  <g id="header" data-pptx-bounds="72.0 67.0 751.8 99.0">
    <text x="72" y="78" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#4C6FFF" font-weight="700" letter-spacing="3">圆桌 01 / MECHANISM</text>
    <text x="72" y="130" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="38" fill="#F1F5F9" font-weight="900">四个阶段，把一场讨论变成一次交付</text>
    <text x="72" y="162" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#5E7093">Moderator 全程掌舵：先定标准，再收集观点，然后合成方案，最后交给质检</text>
  </g>

  <g id="phases" data-pptx-bounds="72.0 236.0 1162.6 250.0">
    <rect x="72.0" y="236" width="264.5" height="250" rx="16" ry="16" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="94.0" y="236.25" width="220.5" height="1.5" fill="url(#edgeTop)" />
    <rect x="100.0" y="266" width="46" height="26" rx="6" ry="6" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1" />
    <text x="123.0" y="284" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#8B5CF6" font-weight="700" text-anchor="middle">01</text>
    <text x="158.0" y="284" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#5E7093" letter-spacing="2">GOAL</text>
    <text x="100.0" y="336" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#F1F5F9" font-weight="900">目标确认</text>
    <line x1="100.0" y1="362" x2="136.0" y2="362" stroke="#8B5CF6" stroke-width="2" />
    <text x="100.0" y="394" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">主持人开场即锁定议题、成功标准与<tspan x="100.0" dy="22.1">轮次上限，讨论有边界才收得住。</tspan></text>
    <line x1="340.5" y1="361" x2="356.5" y2="361" stroke="#33507F" stroke-width="1.4" marker-end="url(#arrowHi)" />
    <rect x="362.5" y="236" width="264.5" height="250" rx="16" ry="16" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="384.5" y="236.25" width="220.5" height="1.5" fill="url(#edgeTop)" />
    <rect x="390.5" y="266" width="46" height="26" rx="6" ry="6" fill="#6366F1" fill-opacity="0.14" stroke="#6366F1" stroke-opacity="0.5" stroke-width="1" />
    <text x="413.5" y="284" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#6366F1" font-weight="700" text-anchor="middle">02</text>
    <text x="448.5" y="284" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#5E7093" letter-spacing="2">DEBATE</text>
    <text x="390.5" y="336" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#F1F5F9" font-weight="900">多轮发言</text>
    <line x1="390.5" y1="362" x2="426.5" y2="362" stroke="#6366F1" stroke-width="2" />
    <text x="390.5" y="394" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">参与者按序表态，第二轮起被指派质<tspan x="390.5" dy="22.1">疑或补充，强制产生对立面。</tspan></text>
    <line x1="631.0" y1="361" x2="647.0" y2="361" stroke="#33507F" stroke-width="1.4" marker-end="url(#arrowHi)" />
    <rect x="653.0" y="236" width="264.5" height="250" rx="16" ry="16" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="675.0" y="236.25" width="220.5" height="1.5" fill="url(#edgeTop)" />
    <rect x="681.0" y="266" width="46" height="26" rx="6" ry="6" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1" />
    <text x="704.0" y="284" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#22D3EE" font-weight="700" text-anchor="middle">03</text>
    <text x="739.0" y="284" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#5E7093" letter-spacing="2">SYNTHESIS</text>
    <text x="681.0" y="336" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#F1F5F9" font-weight="900">共识合成</text>
    <line x1="681.0" y1="362" x2="717.0" y2="362" stroke="#22D3EE" stroke-width="2" />
    <text x="681.0" y="394" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">主持人汇总共识与分歧，产出最终方<tspan x="681.0" dy="22.1">案、执行任务与风险清单。</tspan></text>
    <line x1="921.5" y1="361" x2="937.5" y2="361" stroke="#33507F" stroke-width="1.4" marker-end="url(#arrowHi)" />
    <rect x="943.5" y="236" width="264.5" height="250" rx="16" ry="16" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="965.5" y="236.25" width="220.5" height="1.5" fill="url(#edgeTop)" />
    <rect x="971.5" y="266" width="46" height="26" rx="6" ry="6" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.5" stroke-width="1" />
    <text x="994.5" y="284" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#10B981" font-weight="700" text-anchor="middle">04</text>
    <text x="1029.5" y="284" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#5E7093" letter-spacing="2">FIREWALL</text>
    <text x="971.5" y="336" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#F1F5F9" font-weight="900">出口质检</text>
    <line x1="971.5" y1="362" x2="1007.5" y2="362" stroke="#10B981" stroke-width="2" />
    <text x="971.5" y="394" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">共识必须通过 Validator 四维评分，<tspan x="971.5" dy="22.1">不合格则回炉重修而非直接发布。</tspan></text>
  </g>

  <g id="convergence-note" data-pptx-bounds="72.0 516.0 1136.0 92.0">
    <rect x="72" y="516" width="1136" height="92" rx="16" ry="16" fill="url(#glassSoft)" stroke="#1E2C4A" stroke-width="1" />
    <text x="106" y="552" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#F1F5F9" font-weight="700">收敛保证</text>
    <line x1="204" y1="532" x2="204" y2="578" stroke="#1E2C4A" stroke-width="1" />
    <text x="230" y="546" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">轮次上限硬编码为 3 —— 讨论可以激烈，但必须在第三轮结束前交出结论。主持人不是参与者，它只负责让会议开出结果。</text>
  </g>

