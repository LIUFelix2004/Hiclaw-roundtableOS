  <g id="closing-copy" data-pptx-bounds="72.0 101.0 549.2 480.7">
    <text x="72" y="112" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#4C6FFF" font-weight="700" letter-spacing="3">06 / WHAT’S NEXT</text>
    <text x="72" y="168" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="34" fill="#F1F5F9" font-weight="900">从一场会议，到一套会议制度</text>
    <rect x="72" y="208" width="58" height="22" rx="5" ry="5" fill="#4C6FFF" fill-opacity="0.14" stroke="#4C6FFF" stroke-opacity="0.5" stroke-width="1" />
    <text x="101" y="224" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#4C6FFF" font-weight="700" text-anchor="middle" letter-spacing="1">NEXT</text>
    <text x="146" y="224" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#F1F5F9" font-weight="700">动态议程</text>
    <text x="146" y="248" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">主持人根据议题复杂度自行决定轮次与参会角色</text>
    <rect x="72" y="272.0" width="58" height="22" rx="5" ry="5" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1" />
    <text x="101" y="288.0" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#22D3EE" font-weight="700" text-anchor="middle" letter-spacing="1">THEN</text>
    <text x="146" y="288.0" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#F1F5F9" font-weight="700">Skill 市场</text>
    <text x="146" y="312.0" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">基于版本做能力灰度与自动回滚，圆桌可自由组队</text>
    <rect x="72" y="336.0" width="58" height="22" rx="5" ry="5" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1" />
    <text x="101" y="352.0" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#8B5CF6" font-weight="700" text-anchor="middle" letter-spacing="1">LATER</text>
    <text x="146" y="352.0" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#F1F5F9" font-weight="700">成本护栏</text>
    <text x="146" y="376.0" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">预算上限与配额隔离，让长辩论也花得可控</text>
