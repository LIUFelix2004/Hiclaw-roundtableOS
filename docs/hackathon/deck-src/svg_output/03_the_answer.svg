  <g id="answer-copy" data-pptx-bounds="728.0 119.0 523.6 435.9">
    <text x="728" y="130" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#8B5CF6" font-weight="700" letter-spacing="3">02 / THE ANSWER</text>
    <text x="728" y="202" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="46" fill="#F1F5F9" font-weight="900">AI 圆桌</text>
    <text x="728" y="250" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="25" fill="url(#titleGrad)" font-weight="900">让分歧先发生在系统内部</text>
    <line x1="728" y1="282" x2="816" y2="282" stroke="#8B5CF6" stroke-width="2" />
    <circle cx="736" cy="317" r="4" fill="#8B5CF6" />
    <text x="756" y="322" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#F1F5F9" font-weight="700">同席不同责</text>
    <text x="756" y="348" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#5E7093">七个智能体各自带着专业视角入场，数据、调研、分析、撰写、质检<tspan x="756" dy="21.4">互相独立，天然形成交叉验证。</tspan></text>
    <circle cx="736" cy="407.9" r="4" fill="#8B5CF6" />
    <text x="756" y="412.9" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#F1F5F9" font-weight="700">有立场地发言</text>
    <text x="756" y="438.9" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#5E7093">每次发言都带明确立场标签：提案、质疑、补充、收敛 —— 系统鼓励反<tspan x="756" dy="21.4">对，而不是附和。</tspan></text>
    <circle cx="736" cy="498.79999999999995" r="4" fill="#8B5CF6" />
    <text x="756" y="503.79999999999995" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#F1F5F9" font-weight="700">主持人负责收口</text>
    <text x="756" y="529.8" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#5E7093">Moderator 控制议程与轮次，强制在三轮内产出结论，杜绝多智能体<tspan x="756" dy="21.4">讨论常见的发散不收尾。</tspan></text>
  </g>

