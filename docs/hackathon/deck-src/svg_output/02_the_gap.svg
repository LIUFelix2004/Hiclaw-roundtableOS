  <g id="header" data-pptx-bounds="72.0 67.0 721.2 99.0">
    <text x="72" y="78" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#4C6FFF" font-weight="700" letter-spacing="3">01 / THE GAP</text>
    <text x="72" y="130" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="38" fill="#F1F5F9" font-weight="900">一个 Agent 的答案，没人敢直接用</text>
    <text x="72" y="162" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#5E7093">模型能力已经够用，缺的是一套让结论「可被质疑、可被推翻、可被验证」的机制</text>
  </g>

  <g id="pain-cards" data-pptx-bounds="72.0 232.0 1187.4 240.0">
    <rect x="72.0" y="232" width="357.3333333333333" height="240" rx="16" ry="16" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="96.0" y="232.25" width="309.3333333333333" height="1.5" fill="url(#edgeTop)" />
    <circle cx="130.0" cy="284" r="21" fill="none" stroke="#EF4444" stroke-width="1.4" />
    <text x="130.0" y="289" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#EF4444" font-weight="700" text-anchor="middle">01</text>
    <text x="168.0" y="292" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#F1F5F9" font-weight="900">单点视角</text>
    <line x1="106.0" y1="326" x2="146.0" y2="326" stroke="#EF4444" stroke-width="2" />
    <text x="106.0" y="358" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">一个模型一次推理就给结论，缺少对立面。它的盲<tspan x="106.0" dy="22.4">区就是整个系统的盲区，没有任何环节会提出反对</tspan><tspan x="106.0" dy="22.4">意见。</tspan></text>
    <rect x="461.3333333333333" y="232" width="357.3333333333333" height="240" rx="16" ry="16" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="485.3333333333333" y="232.25" width="309.3333333333333" height="1.5" fill="url(#edgeTop)" />
    <circle cx="519.3333333333333" cy="284" r="21" fill="none" stroke="#F59E0B" stroke-width="1.4" />
    <text x="519.3333333333333" y="289" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#F59E0B" font-weight="700" text-anchor="middle">02</text>
    <text x="557.3333333333333" y="292" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#F1F5F9" font-weight="900">无从追责</text>
    <line x1="495.3333333333333" y1="326" x2="535.3333333333333" y2="326" stroke="#F59E0B" stroke-width="2" />
    <text x="495.3333333333333" y="358" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">答案是怎么来的、哪一步的判断出了问题、依据是<tspan x="495.3333333333333" dy="22.4">什么，全都藏在一次调用里，出错后无法定位到具</tspan><tspan x="495.3333333333333" dy="22.4">体环节。</tspan></text>
    <rect x="850.6666666666666" y="232" width="357.3333333333333" height="240" rx="16" ry="16" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="874.6666666666666" y="232.25" width="309.3333333333333" height="1.5" fill="url(#edgeTop)" />
    <circle cx="908.6666666666666" cy="284" r="21" fill="none" stroke="#8B5CF6" stroke-width="1.4" />
    <text x="908.6666666666666" y="289" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#8B5CF6" font-weight="700" text-anchor="middle">03</text>
    <text x="946.6666666666666" y="292" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#F1F5F9" font-weight="900">不敢落地</text>
    <line x1="884.6666666666666" y1="326" x2="924.6666666666666" y2="326" stroke="#8B5CF6" stroke-width="2" />
    <text x="884.6666666666666" y="358" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">没有质检闸门，输出好坏只能靠人肉复核。最后一<tspan x="884.6666666666666" dy="22.4">公里始终卡在「要不要相信它」，规模化无从谈起。</tspan></text>
  </g>

  <g id="conclusion" data-pptx-bounds="72.0 512.0 1136.0 96.0">
    <rect x="72" y="512" width="1136" height="96" rx="16" ry="16" fill="url(#glassHot)" stroke="#33507F" stroke-width="1" />
    <text x="108" y="552" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#F1F5F9" font-weight="900">真正缺的，是让多个智能体先把问题「吵清楚」的场</text>
    <text x="108" y="582" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#9FB0CC">对抗产生盲区覆盖，收敛产生可执行结论，质检产生可信度。</text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="72.0 664.0 1136.0 26.9">
    <line x1="72" y1="664" x2="1208" y2="664" stroke="#1E2C4A" stroke-width="1" stroke-opacity="0.7" />
    <text x="72" y="688" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#5E7093" letter-spacing="2">HERMES  AGENTOS</text>
    <text x="322" y="688" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#5E7093" letter-spacing="1.4">为什么需要圆桌</text>
    <text x="1208" y="688" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#33507F" font-weight="700" text-anchor="end" letter-spacing="1.6">02 / 16</text>
  </g>
</svg>
