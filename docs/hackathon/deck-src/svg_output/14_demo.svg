    <text x="832" y="410" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#10B981" font-weight="700" letter-spacing="1.4">MOCK_LLM = 1</text>
    <text x="832" y="448" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#F1F5F9" font-weight="900">零依赖演示</text>
    <text x="832" y="476" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#9FB0CC">没有 API Key 也能跑通整场圆桌：辩论、收敛、质检、回滚与<tspan x="832" dy="19.2">Trace 全部真实执行，只有模型响应来自内置数据集。</tspan></text>
  </g>

