  <g id="topic" data-pptx-bounds="72.0 376.0 808.6 172.0">
    <rect x="72" y="376" width="700" height="172" rx="16" ry="16" fill="url(#glassHot)" stroke="#33507F" stroke-width="1" />
    <text x="102" y="410" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#8B5CF6" font-weight="700" letter-spacing="2.2">ROUNDTABLE  TOPIC</text>
    <text x="102" y="442" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#F1F5F9">储能、光伏、新能源车三条主线中，当前哪条最值得优先配置？要求数据员给出装机与渗透率、研究员<tspan x="102" dy="23.8">分析供需与政策、分析师给出分阶段建议、撰稿员汇总为可执行方案，最后必须通过质检。</tspan></text>
  </g>

