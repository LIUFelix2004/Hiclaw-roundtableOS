    <text x="72" y="162" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#5E7093">一个真实会有分歧的议题 —— 储能、光伏、新能源车，哪条最值得优先配置</text>
  </g>

