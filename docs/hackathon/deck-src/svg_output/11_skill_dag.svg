  <g id="cap-note" data-pptx-bounds="72.0 548.0 1136.0 60.0">
    <rect x="72" y="548" width="1136" height="60" rx="14" ry="14" fill="url(#glassHot)" stroke="#33507F" stroke-width="1" />
    <text x="106" y="586" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700">调度器不理解业务，只理解依赖 —— 换场景只需换一份任务图，不改调度代码。</text>
