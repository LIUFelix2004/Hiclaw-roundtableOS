    <text x="1121.25" y="356" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700" text-anchor="middle">成稿</text>
    <text x="1121.25" y="374" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#10B981" text-anchor="middle" letter-spacing="1">LEVEL 4</text>
    <circle cx="676" cy="414" r="3.5" fill="#4C6FFF" />
    <text x="690" y="418" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">Kahn 拓扑排序自动分层，无需手写编排顺序</text>
    <circle cx="676" cy="444" r="3.5" fill="#4C6FFF" />
    <text x="690" y="448" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">同层任务并行执行，上游产出自动注入下游上下文</text>
