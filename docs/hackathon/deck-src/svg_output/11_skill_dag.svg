    <text x="102" y="396" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#F1F5F9">├─ schema.ts</text>
    <text x="292" y="396" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">输出数据结构定义</text>
    <text x="102" y="436" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#F1F5F9">├─ validator.ts</text>
    <text x="292" y="436" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093">输出 Schema 校验</text>
    <text x="102" y="476" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="13" fill="#F1F5F9">└─ tools.ts</text>
