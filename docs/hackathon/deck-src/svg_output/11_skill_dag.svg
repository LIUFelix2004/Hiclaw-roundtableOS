  <g id="header" data-pptx-bounds="72.0 67.0 782.4 99.0">
    <text x="72" y="78" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#4C6FFF" font-weight="700" letter-spacing="3">底座 01 / CAPABILITY</text>
    <text x="72" y="130" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="38" fill="#F1F5F9" font-weight="900">能力怎么装：声明式 Skill + DAG 调度</text>
    <text x="72" y="162" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#5E7093">Agent 只声明「它会什么」，调度、重试、观测由运行时统一托管</text>
  </g>

  <g id="skill-files" data-pptx-bounds="72.0 232.0 540.0 296.0">
