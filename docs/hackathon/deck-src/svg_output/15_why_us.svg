  <g id="header" data-pptx-bounds="72.0 67.0 659.0 99.0">
    <text x="72" y="78" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#4C6FFF" font-weight="700" letter-spacing="3">05 / WHY US</text>
    <text x="72" y="130" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="38" fill="#F1F5F9" font-weight="900">和常见多智能体方案的关键差别</text>
    <text x="72" y="162" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#5E7093">差别不在能不能跑通，而在结论从哪来、跑不通时会发生什么</text>
  </g>

  <g id="compare" data-pptx-bounds="72.0 236.3 1136.0 371.7">
    <text x="72" y="246" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#5E7093" letter-spacing="2">维度</text>
    <text x="240" y="246" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#5E7093" letter-spacing="2">常见做法</text>
    <text x="672" y="246" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#8B5CF6" font-weight="700" letter-spacing="2">HERMES  AGENTOS</text>
    <line x1="72" y1="264" x2="1208" y2="264" stroke="#33507F" stroke-width="1.4" />
    <text x="72" y="320" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700">协作形态</text>
    <text x="240" y="316" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#5E7093">链式调用或主从分发，角色之间不交锋</text>
    <rect x="652" y="292" width="556" height="52" rx="10" ry="10" fill="url(#glassHot)" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="1" />
    <text x="672" y="316" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#F1F5F9">有主持人、有立场、能收敛的圆桌辩论</text>
    <line x1="72" y1="350" x2="1208" y2="350" stroke="#1E2C4A" stroke-width="1" stroke-opacity="0.55" />
    <text x="72" y="386" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700">结论来源</text>
    <text x="240" y="382" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#5E7093">单个模型一次推理的输出</text>
    <rect x="652" y="358" width="556" height="52" rx="10" ry="10" fill="url(#glassHot)" stroke="#1E2C4A" stroke-opacity="1" stroke-width="1" />
    <text x="672" y="382" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#F1F5F9">多视角对抗后被保留下来的部分</text>
    <line x1="72" y1="416" x2="1208" y2="416" stroke="#1E2C4A" stroke-width="1" stroke-opacity="0.55" />
    <text x="72" y="452" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700">输出质量</text>
    <text x="240" y="448" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#5E7093">依赖 Prompt 约束与人工复核</text>
    <rect x="652" y="424" width="556" height="52" rx="10" ry="10" fill="url(#glassHot)" stroke="#1E2C4A" stroke-opacity="1" stroke-width="1" />
    <text x="672" y="448" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#F1F5F9">四维评分防火墙，不合格直接拦截</text>
    <line x1="72" y1="482" x2="1208" y2="482" stroke="#1E2C4A" stroke-width="1" stroke-opacity="0.55" />
    <text x="72" y="518" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700">失败处理</text>
    <text x="240" y="514" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#5E7093">重试若干次，失败即抛错</text>
    <rect x="652" y="490" width="556" height="52" rx="10" ry="10" fill="url(#glassHot)" stroke="#1E2C4A" stroke-opacity="1" stroke-width="1" />
    <text x="672" y="514" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#F1F5F9">四级自愈阶梯，最终降级为带建议的工单</text>
    <line x1="72" y1="548" x2="1208" y2="548" stroke="#1E2C4A" stroke-width="1" stroke-opacity="0.55" />
    <text x="72" y="584" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#F1F5F9" font-weight="700">模型选择</text>
    <text x="240" y="580" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#5E7093">静态配置，改模型要改代码</text>
    <rect x="652" y="556" width="556" height="52" rx="10" ry="10" fill="url(#glassHot)" stroke="#1E2C4A" stroke-opacity="1" stroke-width="1" />
    <text x="672" y="580" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#F1F5F9">经验记忆按历史成功率动态选型</text>
  </g>

  <g id="cmp-note" data-pptx-bounds="72.0 612.0 559.1 15.6">
    <text x="72" y="624" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#5E7093">我们不打算取代编排框架 —— 我们补的是它们普遍留白的那两层：对抗与治理。</text>
  </g>

