  <g id="header" data-pptx-bounds="72.0 67.0 650.2 99.0">
    <text x="72" y="78" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#22D3EE" font-weight="700" letter-spacing="3">底座 03 / OBSERVABILITY</text>
    <text x="72" y="130" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="38" fill="#F1F5F9" font-weight="900">过程怎么查：8 阶段全链路留痕</text>
    <text x="72" y="162" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#5E7093">从上下文构建到模型调用再到输出校验，每一步都带模型、Token、成本与耗时</text>
  </g>

