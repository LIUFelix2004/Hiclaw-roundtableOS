  <g id="obs-cards" data-pptx-bounds="72.0 384.0 1181.1 176.0">
    <rect x="72.0" y="384" width="358.6666666666667" height="176" rx="16" ry="16" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="96.0" y="384.25" width="310.6666666666667" height="1.5" fill="url(#edgeTop)" />
    <text x="100.0" y="418" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#8B5CF6" letter-spacing="1.8">SNAPSHOT</text>
    <text x="100.0" y="456" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#F1F5F9" font-weight="900">快照留痕</text>
    <line x1="100.0" y1="476" x2="134.0" y2="476" stroke="#8B5CF6" stroke-width="2" />
    <text x="100.0" y="504" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">每次执行的输入与输出双向落盘，既是回放素材，也<tspan x="100.0" dy="20.8">是快照回滚的恢复源。</tspan></text>
    <rect x="460.6666666666667" y="384" width="358.6666666666667" height="176" rx="16" ry="16" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="484.6666666666667" y="384.25" width="310.6666666666667" height="1.5" fill="url(#edgeTop)" />
    <text x="488.6666666666667" y="418" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#F59E0B" letter-spacing="1.8">TOKEN / COST</text>
    <text x="488.6666666666667" y="456" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#F1F5F9" font-weight="900">成本透明</text>
    <line x1="488.6666666666667" y1="476" x2="522.6666666666667" y2="476" stroke="#F59E0B" stroke-width="2" />
    <text x="488.6666666666667" y="504" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">Token 按智能体归集、成本按模型归集，实时汇总到<tspan x="488.6666666666667" dy="20.8">统计接口。</tspan></text>
    <rect x="849.3333333333334" y="384" width="358.6666666666667" height="176" rx="16" ry="16" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="873.3333333333334" y="384.25" width="310.6666666666667" height="1.5" fill="url(#edgeTop)" />
    <text x="877.3333333333334" y="418" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#22D3EE" letter-spacing="1.8">DASHBOARD</text>
    <text x="877.3333333333334" y="456" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="24" fill="#F1F5F9" font-weight="900">运行看板</text>
    <line x1="877.3333333333334" y1="476" x2="911.3333333333334" y2="476" stroke="#22D3EE" stroke-width="2" />
    <text x="877.3333333333334" y="504" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">总运行数、成功率、Token 分布与智能体表现对比，<tspan x="877.3333333333334" dy="20.8">一屏掌握全局。</tspan></text>
  </g>

  <g id="obs-note" data-pptx-bounds="72.0 591.1 737.8 16.8">
    <text x="72" y="604" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#9FB0CC">可观测不是事后补的日志 —— 它是回滚决策的输入。没有 Trace 与 Snapshot，就没有自动恢复。</text>
  </g>

