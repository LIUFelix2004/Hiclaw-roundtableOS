  <g id="header" data-pptx-bounds="72.0 67.0 659.0 99.0">
    <text x="72" y="78" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="12" fill="#4C6FFF" font-weight="700" letter-spacing="3">圆桌 04 / SYNTHESIS</text>
    <text x="72" y="130" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="38" fill="#F1F5F9" font-weight="900">收敛：一份四段式的结构化交付</text>
    <text x="72" y="162" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#5E7093">主持人不复述讨论，而是把讨论压缩成能直接派工的结果</text>
  </g>

  <g id="funnel" data-pptx-bounds="72.0 232.0 470.0 288.0">
    <rect x="72" y="232" width="470" height="288" rx="16" ry="16" fill="url(#glassSoft)" stroke="#1E2C4A" stroke-width="1" />
    <text x="100" y="266" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="10.5" fill="#22D3EE" font-weight="700" letter-spacing="2.4">SYNTHESIS  FUNNEL</text>
    <rect x="98" y="302" width="300" height="38" rx="8" ry="8" fill="#5E7093" fill-opacity="0.12" stroke="#5E7093" stroke-opacity="0.45" stroke-width="1" />
    <text x="116" y="326" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#F1F5F9" font-weight="700">全部发言记录</text>
    <text x="512" y="326" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093" text-anchor="end">12 段观点</text>
    <line x1="248.0" y1="342" x2="248.0" y2="356" stroke="#33507F" stroke-width="1.2" marker-end="url(#arrowHi)" />
    <rect x="118" y="358" width="260" height="38" rx="8" ry="8" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.45" stroke-width="1" />
    <text x="136" y="382" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#F1F5F9" font-weight="700">识别共识与分歧</text>
    <text x="512" y="382" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093" text-anchor="end">谁反对什么</text>
    <line x1="248.0" y1="398" x2="248.0" y2="412" stroke="#33507F" stroke-width="1.2" marker-end="url(#arrowHi)" />
    <rect x="138" y="414" width="220" height="38" rx="8" ry="8" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="1" />
    <text x="156" y="438" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#F1F5F9" font-weight="700">压缩为最终方案</text>
    <text x="512" y="438" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093" text-anchor="end">只留可辩护的</text>
    <line x1="248.0" y1="454" x2="248.0" y2="468" stroke="#33507F" stroke-width="1.2" marker-end="url(#arrowHi)" />
    <rect x="158" y="470" width="180" height="38" rx="8" ry="8" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.45" stroke-width="1" />
    <text x="176" y="494" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#F1F5F9" font-weight="700">拆解为执行任务</text>
    <text x="512" y="494" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5E7093" text-anchor="end">可直接派工</text>
  </g>

  <g id="outputs" data-pptx-bounds="570.0 232.0 638.0 286.0">
    <rect x="570.0" y="232" width="305.0" height="134" rx="14" ry="14" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="594.0" y="258" width="8" height="8" rx="2" ry="2" fill="#10B981" />
    <text x="612.0" y="267" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#F1F5F9" font-weight="900">共识</text>
    <text x="594.0" y="294" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#10B981" letter-spacing="1.8">AGREEMENTS</text>
    <text x="594.0" y="322" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#9FB0CC">各智能体确认的判断，附贡献归属</text>
    <rect x="903.0" y="232" width="305.0" height="134" rx="14" ry="14" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="927.0" y="258" width="8" height="8" rx="2" ry="2" fill="#F59E0B" />
    <text x="945.0" y="267" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#F1F5F9" font-weight="900">分歧</text>
    <text x="927.0" y="294" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#F59E0B" letter-spacing="1.8">DISAGREEMENTS</text>
    <text x="927.0" y="322" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#9FB0CC">保留未解决的争议，不假装一致</text>
    <rect x="570.0" y="384" width="305.0" height="134" rx="14" ry="14" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="594.0" y="410" width="8" height="8" rx="2" ry="2" fill="#6366F1" />
    <text x="612.0" y="419" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#F1F5F9" font-weight="900">执行任务</text>
    <text x="594.0" y="446" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#6366F1" letter-spacing="1.8">TASKS</text>
    <text x="594.0" y="474" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#9FB0CC">负责人 / 输入 / 期望产出 / 时限</text>
    <rect x="903.0" y="384" width="305.0" height="134" rx="14" ry="14" fill="url(#glass)" stroke="#1E2C4A" stroke-width="1" />
    <rect x="927.0" y="410" width="8" height="8" rx="2" ry="2" fill="#EF4444" />
    <text x="945.0" y="419" font-family="&quot;Arial Black&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#F1F5F9" font-weight="900">风险项</text>
    <text x="927.0" y="446" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="9" fill="#EF4444" letter-spacing="1.8">RISKS</text>
    <text x="927.0" y="474" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#9FB0CC">触发条件与需要盯住的指标</text>
  </g>

  <g id="handoff" data-pptx-bounds="72.0 540.0 1136.0 68.0">
    <rect x="72" y="540" width="1136" height="68" rx="14" ry="14" fill="url(#glassHot)" stroke="#33507F" stroke-width="1" />
    <text x="106" y="574" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#F1F5F9" font-weight="700">讨论的价值不在于热闹，而在于最后能派工。</text>
    <text x="520" y="574" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#9FB0CC">执行任务清单可以直接喂回任务流水线，由 DAG 调度器接着跑。</text>
  </g>

